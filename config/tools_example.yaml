# ============================================================
# КАК РАЗМЕСТИТЬ СЕКЦИИ В ОДНУ СТРОКУ:
# Добавьте одинаковое значение row у соседних секций, например row: top
#
# КАК ДОБАВИТЬ НОВУЮ СЕКЦИЮ:
# 1. Добавьте блок в sections с id, title и списком tools
# 2. Порядок секций на странице = порядок в этом файле
#
# КАК ДОБАВИТЬ НОВУЮ КНОПКУ:
# 1. Скопируйте блок инструмента и вставьте в tools нужной секции
# 2. Заполните поля:
#    - id: уникальный идентификатор (латиница, без пробелов)
#    - name: название на кнопке
#    - url: ссылка для перехода (http://...) — используется при open_url: true
#    - icon: emoji ИЛИ путь к PNG в static/ ("icons/airflow.png")
#    - running: true — зелёная плашка «ЗАПУЩЕН», false — красная «НЕ ЗАПУЩЕН»
#    - credentials: null — клик сразу открывает url
#                 или login/password — покажет модальное окно
#    - open_url: true — в модалке кнопка «Открыть» (переход по url)
#                false — только креды + connection_guide (без перехода)
#    - connection_guide: текст инструкции (обязателен при open_url: false)
# ============================================================

